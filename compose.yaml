services:
  app:
    image: johandika/jtsid:${APP_VERSION:-1.0.0}
    build: .
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/jts.ini:ro
      - vendor:/var/www/html/vendor
      - compiled-views:/var/www/html/storage/framework/views
      - composer-cache:/root/.composer/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  vendor:
  compiled-views:
  composer-cache:
